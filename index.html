<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アザラシ探偵 - 犯人のサメをさがせ！</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #1e3a8a 100%);
            color: #1e293b;
            min-height: 100vh;
            touch-action: manipulation;
            margin: 0;
            overflow-x: hidden;
        }

        /* アニメーション類 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake-animation { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }

        .disabled-card {
            opacity: 0.5;
            filter: grayscale(80%);
            pointer-events: none;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #fcd34d;
            border-radius: 2px;
            animation: fall linear forwards;
            z-index: 100;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* スタート画面のフェードアウト用 */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start relative">

    <!-- スタート画面（音声再生の許可を得るための画面） -->
    <div id="start-screen" class="fixed inset-0 bg-blue-900 z-[100] flex flex-col items-center justify-center p-4">
        <svg class="w-32 h-32 floating text-white mb-6" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 20 C20 20 10 50 10 70 C10 85 25 90 50 90 C75 90 90 85 90 70 C90 50 80 20 50 20 Z" fill="#e2e8f0"/>
            <circle cx="35" cy="55" r="5" fill="#1e293b"/>
            <circle cx="65" cy="55" r="5" fill="#1e293b"/>
            <path d="M45 65 Q50 70 55 65" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
            <line x1="15" y1="55" x2="25" y2="58" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
            <line x1="15" y1="62" x2="25" y2="62" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
            <line x1="75" y1="58" x2="85" y2="55" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
            <line x1="75" y1="62" x2="85" y2="62" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1 class="text-4xl sm:text-6xl font-black tracking-wider text-yellow-300 drop-shadow-lg mb-8 text-center">アザラシ探偵</h1>
        <button onclick="startGame()" class="bg-gradient-to-r from-green-400 to-green-600 hover:from-green-300 hover:to-green-500 text-white font-black text-2xl sm:text-3xl py-4 px-10 rounded-full shadow-[0_6px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-[6px] transition-all pop-in">
            ゲームスタート 🔍
        </button>
        <p class="text-white mt-6 font-bold opacity-80">※音が出ます</p>
    </div>

    <div id="game-content" class="w-full flex flex-col items-center p-4 sm:p-8 hidden">
        <!-- ヘッダー・ストーリー -->
        <header class="w-full max-w-4xl text-center mb-6 text-white drop-shadow-md">
            <div class="flex items-center justify-center gap-4 mb-2">
                <h1 class="text-3xl sm:text-4xl font-black tracking-wider text-yellow-300 drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)]">アザラシ探偵</h1>
            </div>
            <p class="text-base sm:text-xl font-bold bg-black/30 p-4 rounded-xl shadow-inner backdrop-blur-sm">
                仲間のアザラシが何者かにかじられた！<br>
                証拠の<span class="text-pink-300 text-2xl">『噛み跡』</span>をよく見て、４匹のサメの中から犯人をつきとめよう！
            </p>
        </header>

        <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 証拠（噛み跡）セクション -->
            <div class="col-span-1 lg:col-span-1 flex flex-col items-center">
                <div class="bg-white p-4 sm:p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] w-full text-center border-4 border-pink-400">
                    <h2 class="text-xl sm:text-2xl font-black text-pink-500 mb-4 bg-pink-100 py-2 px-4 rounded-full inline-block">証拠の噛み跡</h2>
                    <div id="evidence-container" class="w-full aspect-square bg-pink-100 rounded-2xl flex items-center justify-center shadow-inner overflow-hidden relative">
                        <!-- SVGがここに挿入されます -->
                    </div>
                    <p class="mt-4 text-sm sm:text-base font-bold text-gray-600">この歯形の特徴を持つサメはだれだ？</p>
                </div>
            </div>

            <!-- 容疑者（サメ）セクション -->
            <div class="col-span-1 lg:col-span-2">
                <div id="suspects-grid" class="grid grid-cols-2 gap-3 sm:gap-6">
                    <!-- サメのカードがここに挿入されます -->
                </div>
            </div>
        </div>
    </div>

    <!-- 結果モーダル（初期状態は非表示） -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-2xl w-full shadow-2xl text-center relative border-8 border-yellow-400">
            <h2 class="text-4xl sm:text-5xl font-black text-red-500 mb-2 drop-shadow-sm">正解！</h2>
            <h3 id="modal-shark-name" class="text-2xl sm:text-3xl font-bold text-blue-800 mb-6"></h3>
            
            <div class="bg-blue-50 p-4 sm:p-6 rounded-2xl mb-6 shadow-inner text-left">
                <div class="flex items-center gap-2 mb-2">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-lg font-bold text-blue-700">サメの歯のヒミツ</span>
                </div>
                <p id="modal-shark-fact" class="text-base sm:text-xl font-bold leading-relaxed text-gray-800"></p>
            </div>

            <button onclick="nextRound()" class="bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-white font-black text-xl sm:text-2xl py-4 px-8 rounded-full shadow-[0_5px_0_#c2410c] active:shadow-[0_0px_0_#c2410c] active:translate-y-[5px] transition-all w-full sm:w-auto">
                次の事件へ！ 🐾
            </button>
        </div>
    </div>

    <script>
        const sharkBodyPath = "M80 50 C80 30 60 20 40 30 C30 35 15 35 5 45 C15 50 25 60 40 60 C55 60 70 65 80 50 Z M40 30 L45 10 L55 25 Z M5 45 L5 25 L15 35 Z M10 45 L5 60 L20 52 Z M50 60 L45 75 L60 60 Z";

        const sharkData = [
            {
                id: 'greatwhite', name: 'ホホジロザメ', color: '#94a3b8',
                fact: 'ホホジロザメの歯は大きな「正三角形」で、フチがノコギリのようにギザギザしているよ！獲物のお肉を切り裂くのにぴったりなんだ。',
                biteSvg: `
                    <svg viewBox="0 0 100 100" class="w-full h-full p-4">
                        <path d="M10 50 L25 30 L40 50 L55 30 L70 50 L85 30 L95 50" fill="none" stroke="#be123c" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M10 50 L25 70 L40 50 L55 70 L70 50 L85 70 L95 50" fill="none" stroke="#be123c" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M20 40 L22 38 L25 42 L28 38 L30 40" fill="none" stroke="#be123c" stroke-width="1.5"/>
                        <path d="M50 40 L52 38 L55 42 L58 38 L60 40" fill="none" stroke="#be123c" stroke-width="1.5"/>
                    </svg>
                `
            },
            {
                id: 'sandtiger', name: 'シロワニ', color: '#a3a3a3',
                fact: 'シロワニの歯は細長くて、先が鋭く尖っているよ！くわえたお魚を絶対に逃がさないための、フォークのような形なんだ。',
                biteSvg: `
                    <svg viewBox="0 0 100 100" class="w-full h-full p-4">
                        <circle cx="30" cy="30" r="3" fill="#be123c" />
                        <line x1="30" y1="20" x2="30" y2="40" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="50" cy="25" r="3" fill="#be123c" />
                        <line x1="50" y1="15" x2="50" y2="35" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="70" cy="35" r="3" fill="#be123c" />
                        <line x1="70" y1="25" x2="70" y2="45" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="35" cy="70" r="3" fill="#be123c" />
                        <line x1="35" y1="60" x2="35" y2="80" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="65" cy="65" r="3" fill="#be123c" />
                        <line x1="65" y1="55" x2="65" y2="75" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                `
            },
            {
                id: 'tiger', name: 'イタチザメ', color: '#737373',
                fact: 'イタチザメの歯は、ハート型やニワトリのトサカのように先が曲がっているよ！この形のおかげで、硬いウミガメの甲羅もノコギリのように噛み砕けるんだ。',
                biteSvg: `
                    <svg viewBox="0 0 100 100" class="w-full h-full p-4">
                        <path d="M20 40 Q 35 20 45 40 Q 60 20 70 40 Q 85 25 90 50" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M25 65 Q 40 85 50 65 Q 65 85 75 65 Q 85 80 90 55" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                `
            },
            {
                id: 'cookiecutter', name: 'ダルマザメ', color: '#8b5cf6',
                fact: 'ダルマザメは小さなサメだけど、アザラシやクジラの体にかじりついて、体をグルっと回転させることで、お肉を「まん丸」にくり抜いて食べるんだよ！',
                biteSvg: `
                    <svg viewBox="0 0 100 100" class="w-full h-full p-4">
                        <circle cx="50" cy="50" r="30" fill="#fecdd3" stroke="#be123c" stroke-width="4" stroke-dasharray="4 2"/>
                        <circle cx="50" cy="50" r="25" fill="#be123c" opacity="0.8"/>
                    </svg>
                `
            }
        ];

        let currentCulprit = null;
        let isWaitingForNext = false;
        let previousCulpritId = null;

        // --- Web Audio API (効果音 ＆ BGM) ---
        let audioCtx;
        let bgmVolume = 0.1; // BGMの音量控えめ
        let bgmInterval;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 基本の音を鳴らす関数
        function playTone(freq, type, duration, vol, startTime = 0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            
            // アタックとリリースをつけてクリック音（ブツッという音）を防ぐ
            gain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + startTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        // BGMのループ再生（探偵風の怪しげな8音メロディ）
        const bgmNotes = [220.00, 261.63, 329.63, 261.63, 220.00, 164.81, 196.00, 207.65]; // A3, C4, E4, C4, A3, E3, G3, G#3
        let noteIdx = 0;
        let nextNoteTime = 0;
        let isBgmRunning = false;

        function scheduleBGM() {
            if (!audioCtx || !isBgmRunning) return;
            // 少し先の時間まで音符をスケジュールする（タイマーのズレを防ぐため）
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                let freq = bgmNotes[noteIdx];
                if (freq > 0) {
                    playTone(freq, 'triangle', 0.25, bgmVolume, nextNoteTime - audioCtx.currentTime);
                }
                nextNoteTime += 0.35; // 1音の長さ(テンポ)
                noteIdx = (noteIdx + 1) % bgmNotes.length;
            }
            requestAnimationFrame(scheduleBGM);
        }

        function startBGM() {
            if (isBgmRunning) return;
            isBgmRunning = true;
            nextNoteTime = audioCtx.currentTime + 0.1;
            scheduleBGM();
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.15, 0.3, 0);    // C5
            playTone(659.25, 'sine', 0.15, 0.3, 0.15); // E5
            playTone(783.99, 'sine', 0.4,  0.3, 0.3);  // G5
        }

        function playWrongSound() {
            playTone(150, 'sawtooth', 0.25, 0.2, 0);
            playTone(140, 'sawtooth', 0.35, 0.2, 0.2);
        }

        // --- ゲームロジック ---

        function startGame() {
            initAudio(); // ユーザーのクリックでオーディオを許可
            startBGM();  // BGM開始

            const startScreen = document.getElementById('start-screen');
            startScreen.classList.add('fade-out');
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                document.getElementById('game-content').classList.remove('hidden');
                document.getElementById('game-content').classList.add('flex');
                initGame();
            }, 500);
        }

        function initGame() {
            isWaitingForNext = false;
            
            let availableSharks = sharkData;
            if (previousCulpritId) {
                availableSharks = sharkData.filter(s => s.id !== previousCulpritId);
            }
            currentCulprit = availableSharks[Math.floor(Math.random() * availableSharks.length)];
            previousCulpritId = currentCulprit.id;
            
            document.getElementById('evidence-container').innerHTML = currentCulprit.biteSvg;
            renderSuspects();
        }

        function renderSuspects() {
            const grid = document.getElementById('suspects-grid');
            grid.innerHTML = ''; 

            const shuffledSharks = [...sharkData].sort(() => Math.random() - 0.5);

            shuffledSharks.forEach(shark => {
                const card = document.createElement('div');
                card.id = `card-${shark.id}`;
                card.className = 'bg-white rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col items-center justify-between border-b-4 border-gray-200 transition-all';
                
                let pattern = '';
                if(shark.id === 'tiger') {
                    pattern = `<path d="M45 35 L45 45 M55 38 L55 48 M65 42 L65 52" stroke="#404040" stroke-width="2" stroke-linecap="round"/>`;
                }

                card.innerHTML = `
                    <h3 class="text-lg sm:text-xl font-black text-gray-800 mb-2">${shark.name}</h3>
                    <div class="w-24 h-24 sm:w-32 sm:h-32 bg-blue-50 rounded-full flex items-center justify-center mb-4 relative overflow-hidden border-2 border-blue-100">
                        <svg viewBox="0 0 100 100" class="w-20 h-20 sm:w-28 sm:h-28">
                            <path d="${sharkBodyPath}" fill="${shark.color}" stroke="#1e293b" stroke-width="2"/>
                            <circle cx="65" cy="45" r="2.5" fill="#fff"/>
                            <circle cx="66" cy="45" r="1.5" fill="#000"/>
                            <line x1="50" y1="45" x2="50" y2="55" stroke="#1e293b" stroke-width="1.5"/>
                            <line x1="47" y1="46" x2="47" y2="54" stroke="#1e293b" stroke-width="1.5"/>
                            <line x1="53" y1="46" x2="53" y2="54" stroke="#1e293b" stroke-width="1.5"/>
                            ${pattern}
                        </svg>
                    </div>
                    <button onclick="checkAnswer('${shark.id}')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-3 px-4 rounded-xl shadow-[0_4px_0_#1d4ed8] active:shadow-[0_0px_0_#1d4ed8] active:translate-y-[4px] transition-all text-base sm:text-lg">
                        これだ！ 🔍
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function checkAnswer(selectedId) {
            if (isWaitingForNext) return;

            const card = document.getElementById(`card-${selectedId}`);
            const btn = card.querySelector('button');

            if (selectedId === currentCulprit.id) {
                isWaitingForNext = true;
                playCorrectSound();
                
                btn.className = "w-full bg-green-500 text-white font-black py-3 px-4 rounded-xl shadow-[0_4px_0_#15803d] text-base sm:text-lg";
                btn.innerHTML = "正解！🎉";
                
                createConfetti();
                
                const modal = document.getElementById('result-modal');
                const nameEl = document.getElementById('modal-shark-name');
                const factEl = document.getElementById('modal-shark-fact');
                nameEl.textContent = `犯人は「${currentCulprit.name}」だ！`;
                factEl.textContent = currentCulprit.fact;

                setTimeout(() => {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                    modal.querySelector('.bg-white').classList.add('pop-in');
                }, 500);

            } else {
                playWrongSound();

                card.classList.remove('shake-animation');
                void card.offsetWidth; 
                card.classList.add('shake-animation');
                
                setTimeout(() => {
                    card.classList.add('disabled-card');
                    btn.innerHTML = "ちがった…";
                }, 500);
            }
        }

        function nextRound() {
            const modal = document.getElementById('result-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modal.querySelector('.bg-white').classList.remove('pop-in');
            
            const confettis = document.querySelectorAll('.confetti');
            confettis.forEach(c => c.remove());

            initGame();
        }

        function createConfetti() {
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#ec4899'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>

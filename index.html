<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カモメ探偵とアザラシの事件簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0ea5e9;
            color: #1e293b;
            margin: 0;
            overflow: hidden; /* スクロール禁止（アプリ風） */
            touch-action: manipulation;
            user-select: none;
        }

        /* ------------------ アニメーション ------------------ */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .swaying { transform-origin: bottom center; animation: sway 4s ease-in-out infinite; }

        @keyframes swim {
            0% { transform: translateX(-50px) translateY(0); }
            50% { transform: translateX(50vw) translateY(-20px); }
            100% { transform: translateX(110vw) translateY(10px); }
        }
        .swimming { animation: swim 12s linear infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake-animation { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        /* カメラフラッシュ用 */
        #flash-overlay {
            transition: opacity 0.1s ease-out;
        }

        /* 探索ポイントのハイライトエフェクト */
        .clickable-target {
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .clickable-target::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 3px dashed rgba(255,255,255,0.5);
            animation: rotatePulse 4s linear infinite;
            pointer-events: none;
            opacity: 0.7;
        }
        .clickable-target:active { transform: scale(0.95); }
        .target-found::after { border-color: #4ade80; animation: none; opacity: 1; border-style: solid; }

        @keyframes rotatePulse {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .disabled-card { opacity: 0.5; filter: grayscale(80%); pointer-events: none; }
        
        /* 波の背景 */
        .wave-bg {
            background: linear-gradient(180deg, #38bdf8 0%, #0369a1 100%);
        }
    </style>
</head>
<body class="w-screen h-screen relative">

    <!-- 0. システム音声許可用の初期画面 -->
    <div id="init-screen" class="fixed inset-0 bg-blue-900 z-[200] flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl sm:text-6xl font-black text-white mb-8 text-center drop-shadow-lg">カモメ探偵と<br>アザラシの事件簿</h1>
        <button onclick="initGameAudio()" class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-black text-2xl py-4 px-10 rounded-full shadow-[0_6px_0_#b45309] active:translate-y-[6px] active:shadow-none transition-all">
            あそぶ！ (音が出ます)
        </button>
    </div>

    <!-- 1. タイトル画面 -->
    <div id="title-screen" class="fixed inset-0 bg-sky-300 z-[100] flex flex-col items-center justify-between hidden">
        <!-- 空とカモメ -->
        <div class="relative w-full h-1/2 flex items-center justify-center">
            <div class="text-[120px] floating z-10 drop-shadow-lg">🕊️</div>
            <h1 class="absolute top-10 text-4xl sm:text-5xl font-black text-blue-900 drop-shadow-md text-center">カモメ探偵と<br>アザラシの事件簿</h1>
        </div>
        
        <!-- 海面と氷山、アザラシ、サメの影 -->
        <div class="relative w-full h-1/2 wave-bg border-t-4 border-white/50 flex flex-col items-center">
            <!-- 氷山と寝ているアザラシ -->
            <div class="absolute -top-12 w-64 h-32 flex flex-col items-center">
                <div class="absolute -top-16 z-10 flex items-center">
                    <div class="text-[100px] drop-shadow-md">🦭</div>
                    <div class="text-2xl font-black text-blue-900 floating absolute -right-6 top-4">Zzz</div>
                </div>
                <svg class="w-full h-full" viewBox="0 0 100 50" preserveAspectRatio="none">
                    <path d="M0 50 L20 20 L40 25 L60 10 L80 20 L100 50 Z" fill="#f8fafc"/>
                </svg>
            </div>
            <!-- サメの影 -->
            <svg class="w-48 h-24 absolute top-10 opacity-30 swimming" viewBox="0 0 100 50">
                <path d="M90 25 C70 10 30 10 10 25 C30 40 70 40 90 25 Z" fill="#000"/>
                <path d="M50 15 L40 0 L60 15 Z" fill="#000"/>
            </svg>
            <button onclick="startInvestigation()" class="absolute bottom-10 bg-green-500 hover:bg-green-400 text-white font-black text-2xl py-4 px-10 rounded-full shadow-[0_6px_0_#166534] active:translate-y-[6px] active:shadow-none transition-all z-20">

    </div>

    <!-- 2. 調査画面（メインゲーム） -->
    <div id="game-screen" class="fixed inset-0 wave-bg hidden">
        <!-- 探偵ブック呼び出しボタン -->
        <button onclick="toggleBook()" class="absolute top-4 right-4 z-40 bg-yellow-400 p-3 rounded-xl shadow-lg border-2 border-yellow-200 flex flex-col items-center active:scale-95 transition-transform">
            <svg class="w-8 h-8 text-yellow-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>

        </button>

        <div class="w-full h-full relative overflow-hidden">
            <!-- 海草（タップ可能） -->

            </div>

            <!-- 泳ぐイワシ（タップ可能） -->
            <div id="target-sardine" class="absolute top-32 left-0 w-16 h-16 swimming clickable-target z-20 flex items-center justify-center" onclick="findClue('sardine')">

            <!-- アザラシ被害者 -->

                    <div class="text-[160px] leading-none">🦭</div>
                    
                    <!-- 顔（タップ可能） -->
                    <div id="target-face" class="clickable-target absolute top-4 left-10 w-24 h-24 rounded-full flex items-start justify-end" onclick="findClue('face')">
                        <div class="text-4xl -mt-2 -mr-2 bg-white/80 rounded-full shadow-sm">😭</div>
                    </div>
                    
                    <!-- 噛み跡（タップ可能） -->
                    <div id="target-bite" class="clickable-target absolute bottom-8 right-10 w-20 h-20 bg-pink-100/90 rounded-full flex items-center justify-center shadow-inner border-4 border-pink-300 backdrop-blur-sm" onclick="findClue('bite')">

            </div>

    <!-- カメラフラッシュ（白画面） -->

    <!-- 手がかり発見モーダル -->

            <div id="clue-modal-img" class="w-32 h-32 mx-auto bg-blue-50 rounded-2xl mb-4 mt-4 flex items-center justify-center border-2 border-blue-200">
                <!-- SVGが挿入される -->
            </div>
            <h3 id="clue-modal-title" class="text-xl font-black text-blue-900 mb-2"></h3>

            <button onclick="closeClueModal()" class="mt-6 w-full bg-blue-500 hover:bg-blue-400 text-white font-black text-lg py-3 rounded-xl shadow-[0_4px_0_#1e3a8a] active:translate-y-[4px] active:shadow-none transition-all">

    <!-- 探偵ブック（手帳）UI -->
    <div id="detective-book" class="fixed inset-0 bg-black/50 z-[450] hidden flex-col items-center justify-center p-2 sm:p-4 backdrop-blur-sm">
        <div class="bg-[#fef3c7] w-full max-w-2xl h-[90vh] rounded-r-3xl rounded-l-md shadow-2xl border-l-8 border-yellow-600 p-4 sm:p-6 relative flex flex-col pop-in">
            <!-- 閉じるボタン -->

            <h2 class="text-2xl sm:text-3xl font-black text-yellow-900 mb-4 border-b-4 border-yellow-400 pb-2 flex items-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                カモメ探偵の手帳
            </h2>

            <!-- 証拠リスト -->
            <div class="flex-1 overflow-y-auto space-y-3 pr-2">
                <div id="book-face" class="border-2 border-dashed border-gray-400 rounded-xl p-3 flex items-center gap-4 bg-white/50 opacity-60">
                    <div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0 flex items-center justify-center text-3xl">❓</div>
                    <div class="text-gray-500 font-bold">まだ調べていない</div>

                <div id="book-bite" class="border-2 border-dashed border-gray-400 rounded-xl p-3 flex items-center gap-4 bg-white/50 opacity-60">
                    <div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0 flex items-center justify-center text-3xl">❓</div>
                    <div class="text-gray-500 font-bold">まだ調べていない</div>
                </div>
                <div id="book-sardine" class="border-2 border-dashed border-gray-400 rounded-xl p-3 flex items-center gap-4 bg-white/50 opacity-60">
                    <div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0 flex items-center justify-center text-3xl">❓</div>
                    <div class="text-gray-500 font-bold">まだ調べていない</div>
                </div>
                <div id="book-weed" class="border-2 border-dashed border-gray-400 rounded-xl p-3 flex items-center gap-4 bg-white/50 opacity-60">
                    <div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0 flex items-center justify-center text-3xl">❓</div>

            </button>

    </div>

    <!-- 3. 推理画面（犯人選択） -->
    <div id="deduce-screen" class="fixed inset-0 bg-blue-900 z-[400] hidden flex-col items-center p-4 overflow-y-auto">
        <header class="w-full max-w-4xl text-center mb-4 mt-4 text-white">
            <h2 class="text-2xl sm:text-4xl font-black text-yellow-300 drop-shadow-md mb-2">犯人はこの中にいる！</h2>
            <p class="text-sm sm:text-base font-bold bg-black/40 p-3 rounded-xl">手帳の証拠と一致するサメを選ぼう！</p>
            <button onclick="toggleBook()" class="mt-2 bg-yellow-400 text-yellow-900 px-4 py-2 rounded-full font-bold text-sm shadow-md active:scale-95">手帳を見返す 📖</button>
        </header>

        <div id="suspects-grid" class="w-full max-w-4xl grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 pb-10">
            <!-- サメカードが挿入される -->
        </div>
    </div>

    <!-- 結果モーダル -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 z-[600] hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl text-center pop-in border-8 border-green-400">
            <h2 id="result-title" class="text-4xl font-black mb-2"></h2>
            <div id="result-shark-img" class="w-32 h-32 mx-auto bg-blue-50 rounded-full mb-4 border-4 border-blue-200"></div>
            <p id="result-text" class="text-lg font-bold text-gray-800 bg-gray-100 p-4 rounded-xl mb-6"></p>
            
            <button id="btn-next-case" onclick="resetGame()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-black text-xl py-4 rounded-full shadow-[0_5px_0_#b45309] active:translate-y-[5px] active:shadow-none transition-all">
                次の事件へ！ 🐾
            </button>
            <button id="btn-retry" onclick="closeResultModal()" class="w-full hidden bg-gray-400 hover:bg-gray-300 text-white font-black text-xl py-4 rounded-full shadow-[0_5px_0_#4b5563] active:translate-y-[5px] active:shadow-none transition-all">
                もう一度推理する
            </button>
        </div>
    </div>

    <script>
        // --- データ定義 ---
        const sharkBodyPath = "M80 50 C80 30 60 20 40 30 C30 35 15 35 5 45 C15 50 25 60 40 60 C55 60 70 65 80 50 Z M40 30 L45 10 L55 25 Z M5 45 L5 25 L15 35 Z M10 45 L5 60 L20 52 Z M50 60 L45 75 L60 60 Z";
        
        // 調査アイテムのベース情報（アイコン用SVG）
        const itemInfo = {
            face: { title: 'アザラシの証言', svg: '<div class="text-6xl flex items-center justify-center w-full h-full">😭</div>' },
            bite: { title: '残された歯形', svg: '' },
            sardine: { title: 'イワシの証言', svg: '<div class="text-6xl flex items-center justify-center w-full h-full">🐟</div>' },
            weed: { title: '現場の海草', svg: '<div class="text-6xl flex items-center justify-center w-full h-full">🌿</div>' }
        };

        const sharks = [
            {
                id: 'greatwhite', name: 'ホホジロザメ', color: '#94a3b8',
                desc: '獲物を切り裂く大きな三角形の歯を持つ、海で一番強くて大きなハンターだ！',
                clues: {
                    face: '痛いよ〜、寝ていたらいきなりガブッとやられたんだ...',
                    bite: '大きな正三角形で、フチがギザギザな跡だ！',
                    sardine: '弾丸みたいに速くて、ものすごくデカかったよ！',
                    weed: '乱暴に引きちぎられている。かなり力強い犯人だ。'
                },
                biteSvg: '<svg viewBox="0 0 100 100" class="w-full h-full p-2"><path d="M10 50 L25 30 L40 50 L55 30 L70 50 L85 30 L95 50" fill="none" stroke="#be123c" stroke-width="4"/><path d="M10 50 L25 70 L40 50 L55 70 L70 50 L85 70 L95 50" fill="none" stroke="#be123c" stroke-width="4"/></svg>'
            },
            {
                id: 'sandtiger', name: 'シロワニ', color: '#a3a3a3',
                desc: '恐ろしい見た目だけど実はのんびり屋。針のような細い歯で獲物を逃がさない！',
                clues: {
                    face: '痛いよ〜、寝ていたらいきなりガブッとやられたんだ...',
                    bite: '細長くて鋭い、針のようなキバが刺さった跡だ！',
                    sardine: '体は大きかったけど、ゆったり泳いでいたような…',
                    weed: '細い歯が引っかかったような傷跡がある。'
                },
                biteSvg: '<svg viewBox="0 0 100 100" class="w-full h-full p-2"><line x1="30" y1="20" x2="30" y2="40" stroke="#be123c" stroke-width="3"/><line x1="50" y1="15" x2="50" y2="35" stroke="#be123c" stroke-width="3"/><line x1="70" y1="25" x2="70" y2="45" stroke="#be123c" stroke-width="3"/><line x1="35" y1="60" x2="35" y2="80" stroke="#be123c" stroke-width="3"/><line x1="65" y1="55" x2="65" y2="75" stroke="#be123c" stroke-width="3"/></svg>'
            },
            {
                id: 'tiger', name: 'イタチザメ', color: '#737373',
                desc: '体にシマシマ模様があるよ。先が曲がったノコギリのような歯でなんでも噛み砕く！',
                clues: {
                    face: '痛いよ〜、寝ていたらいきなりガブッとやられたんだ...',
                    bite: '先が斜めに曲がった、ノコギリみたいな跡だ！',
                    sardine: '体にシマシマ模様があった気がするよ！',
                    weed: 'ノコギリでスパッと切られたようにキレイに切れている。'
                },
                biteSvg: '<svg viewBox="0 0 100 100" class="w-full h-full p-2"><path d="M20 40 Q 35 20 45 40 Q 60 20 70 40 Q 85 25 90 50" fill="none" stroke="#be123c" stroke-width="5"/><path d="M25 65 Q 40 85 50 65 Q 65 85 75 65 Q 85 80 90 55" fill="none" stroke="#be123c" stroke-width="5"/></svg>'
            },
            {
                id: 'cookiecutter', name: 'ダルマザメ', color: '#8b5cf6',
                desc: 'とても小さなサメだけど、大きな動物にこっそり近づいて、丸くお肉をえぐり取るんだ！',
                clues: {
                    face: '痛いよ〜、寝ていたらいきなりガブッとやられたんだ...',
                    bite: 'アイスクリームディッシャーでえぐったような、まん丸の跡だ！',
                    sardine: 'えっ？犯人？すごく小さかったよ！まさかあんなヤツが…',
                    weed: 'ほとんど荒らされていない。こっそり近づいたみたいだ。'
                },
                biteSvg: '<svg viewBox="0 0 100 100" class="w-full h-full p-2"><circle cx="50" cy="50" r="30" fill="#fecdd3" stroke="#be123c" stroke-width="4" stroke-dasharray="4 2"/></svg>'
            }
        ];

        let currentCulprit = null;
        let foundClues = new Set();
        let audioCtx;
        let isBgmRunning = false;
        
        // --- オーディオ処理 ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol, startTime = 0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        // カメラのシャッター音（高い短音2つ）
        function playShutter() {
            initAudio();
            playTone(1200, 'square', 0.05, 0.2, 0);
            playTone(800, 'square', 0.05, 0.2, 0.05);
        }

        function playCorrectSound() {
            initAudio();
            playTone(523.25, 'sine', 0.15, 0.3, 0);
            playTone(659.25, 'sine', 0.15, 0.3, 0.15);
            playTone(783.99, 'sine', 0.4,  0.3, 0.3);
        }

        function playWrongSound() {
            initAudio();
            playTone(150, 'sawtooth', 0.25, 0.2, 0);
            playTone(140, 'sawtooth', 0.35, 0.2, 0.2);
        }

        // BGM（探偵風ループ）
        const bgmNotes = [220.00, 261.63, 329.63, 261.63, 220.00, 164.81, 196.00, 207.65];
        let noteIdx = 0;
        let nextNoteTime = 0;

        function scheduleBGM() {
            if (!audioCtx || !isBgmRunning) return;
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                if (bgmNotes[noteIdx] > 0) {
                    playTone(bgmNotes[noteIdx], 'triangle', 0.25, 0.05, nextNoteTime - audioCtx.currentTime);
                }
                nextNoteTime += 0.4;
                noteIdx = (noteIdx + 1) % bgmNotes.length;
            }
            requestAnimationFrame(scheduleBGM);
        }

        function initGameAudio() {
            initAudio();
            if (!isBgmRunning) {
                isBgmRunning = true;
                nextNoteTime = audioCtx.currentTime + 0.1;
                scheduleBGM();
            }
            document.getElementById('init-screen').style.display = 'none';
            document.getElementById('title-screen').classList.remove('hidden');
        }

        // --- ゲーム進行ロジック ---
        function startInvestigation() {
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // 犯人をランダムに選定（前回と被らないように）
            let available = sharks;
            if (currentCulprit) {
                available = sharks.filter(s => s.id !== currentCulprit.id);
            }
            currentCulprit = available[Math.floor(Math.random() * available.length)];
            
            // 歯形の見た目を犯人に合わせる
            document.getElementById('target-bite').innerHTML = currentCulprit.biteSvg;
            
            updateBookUI();
        }

        // アイテムタップ処理
        function findClue(type) {
            if(foundClues.has(type)) return; // 取得済みなら何もしない

            // 1. シャッター音とフラッシュ
            playShutter();
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            
            setTimeout(() => {
                flash.style.opacity = '0';
                // 2. モーダルに情報をセットして表示
                document.getElementById('clue-modal-title').innerText = itemInfo[type].title;
                document.getElementById('clue-modal-img').innerHTML = type === 'bite' ? currentCulprit.biteSvg : itemInfo[type].svg;
                document.getElementById('clue-modal-text').innerText = currentCulprit.clues[type];
                
                document.getElementById('clue-modal').classList.remove('hidden');
                document.getElementById('clue-modal').classList.add('flex');
                
                // 見つけた状態にする
                foundClues.add(type);
                document.getElementById(`target-${type}`).classList.add('target-found');
                updateBookUI();
            }, 100);
        }

        function closeClueModal() {
            document.getElementById('clue-modal').classList.add('hidden');
            document.getElementById('clue-modal').classList.remove('flex');
            
            // 手帳をチラ見せする演出（任意）
            toggleBook();
        }

        // 手帳のUI更新
        function updateBookUI() {
            document.getElementById('clue-counter').innerText = `${foundClues.size}/4 証拠`;
            
            ['face', 'bite', 'sardine', 'weed'].forEach(type => {
                const el = document.getElementById(`book-${type}`);
                if (foundClues.has(type)) {
                    el.classList.remove('bg-white/50', 'opacity-60', 'border-dashed');
                    el.classList.add('bg-white', 'border-solid', 'border-blue-400');
                    el.innerHTML = `
                        <div class="w-16 h-16 bg-blue-50 border-2 border-blue-200 rounded flex-shrink-0 flex items-center justify-center p-1">
                            ${type === 'bite' ? currentCulprit.biteSvg : itemInfo[type].svg}
                        </div>
                        <div>
                            <div class="text-xs text-blue-500 font-bold mb-1">${itemInfo[type].title}</div>
                            <div class="text-sm font-bold text-gray-800 leading-tight">${currentCulprit.clues[type]}</div>
                        </div>
                    `;
                }
            });

            // 4つ揃ったら推理ボタン表示
            if (foundClues.size === 4) {
                document.getElementById('btn-deduce').classList.remove('hidden');
            }
        }

        function toggleBook() {
            const book = document.getElementById('detective-book');
            if (book.classList.contains('hidden')) {
                book.classList.remove('hidden');
                book.classList.add('flex');
            } else {
                book.classList.add('hidden');
                book.classList.remove('flex');
            }
        }

        // --- 推理フェーズ ---
        function startDeduction() {
            toggleBook(); // 本を閉じる
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('deduce-screen').classList.remove('hidden');
            document.getElementById('deduce-screen').classList.add('flex');
            
            renderSuspects();
        }

        function renderSuspects() {
            const grid = document.getElementById('suspects-grid');
            grid.innerHTML = '';
            
            // 順番をシャッフル
            const shuffled = [...sharks].sort(() => Math.random() - 0.5);

            shuffled.forEach(shark => {
                const card = document.createElement('div');
                card.id = `suspect-${shark.id}`;
                card.className = 'bg-white rounded-2xl p-4 shadow-lg flex flex-col items-center justify-between border-b-4 border-gray-200 transition-all';
                
                // イタチザメ用の縞模様
                let pattern = '';
                if(shark.id === 'tiger') {
                    pattern = `<path d="M45 35 L45 45 M55 38 L55 48 M65 42 L65 52" stroke="#404040" stroke-width="2" stroke-linecap="round"/>`;
                }

                card.innerHTML = `
                    <h3 class="text-lg font-black text-gray-800 mb-2">${shark.name}</h3>
                    <div class="w-full aspect-square bg-blue-50 rounded-xl flex items-center justify-center mb-4 border-2 border-blue-100 relative overflow-hidden shadow-inner">
                        <svg viewBox="0 0 100 100" class="w-20 h-20 sm:w-28 sm:h-28">
                            <path d="${sharkBodyPath}" fill="${shark.color}" stroke="#1e293b" stroke-width="2"/>
                            <!-- 目 -->
                            <circle cx="65" cy="45" r="2.5" fill="#fff"/>
                            <circle cx="66" cy="45" r="1.5" fill="#000"/>
                            <!-- エラ -->
                            <line x1="50" y1="45" x2="50" y2="55" stroke="#1e293b" stroke-width="1.5"/>
                            <line x1="47" y1="46" x2="47" y2="54" stroke="#1e293b" stroke-width="1.5"/>
                            <line x1="53" y1="46" x2="53" y2="54" stroke="#1e293b" stroke-width="1.5"/>
                            ${pattern}
                        </svg>
                    </div>
                    <button onclick="checkAnswer('${shark.id}')" class="w-full bg-red-500 hover:bg-red-600 text-white font-black py-3 rounded-xl shadow-[0_4px_0_#9f1239] active:translate-y-[4px] active:shadow-none transition-all">
                        犯人はお前だ！
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function checkAnswer(selectedId) {
            const card = document.getElementById(`suspect-${selectedId}`);
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            const text = document.getElementById('result-text');
            const img = document.getElementById('result-shark-img');
            
            if (selectedId === currentCulprit.id) {
                // 正解
                playCorrectSound();
                title.innerText = "大正解！🎉";
                title.className = "text-4xl font-black mb-2 text-green-500";
                modal.querySelector('.bg-white').className = "bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl text-center pop-in border-8 border-green-400";
                
                text.innerText = `犯人は「${currentCulprit.name}」だ！\n\n${currentCulprit.desc}`;
                
                // 犯人の画像セット（SVG）
                let pattern = '';
                if(currentCulprit.id === 'tiger') {
                    pattern = `<path d="M45 35 L45 45 M55 38 L55 48 M65 42 L65 52" stroke="#404040" stroke-width="2" stroke-linecap="round"/>`;
                }
                img.innerHTML = `
                    <svg viewBox="0 0 100 100" class="w-full h-full p-2">
                        <path d="${sharkBodyPath}" fill="${currentCulprit.color}" stroke="#1e293b" stroke-width="2"/>
                        <circle cx="65" cy="45" r="2.5" fill="#fff"/>
                        <circle cx="66" cy="45" r="1.5" fill="#000"/>
                        <line x1="50" y1="45" x2="50" y2="55" stroke="#1e293b" stroke-width="1.5"/>
                        <line x1="47" y1="46" x2="47" y2="54" stroke="#1e293b" stroke-width="1.5"/>
                        <line x1="53" y1="46" x2="53" y2="54" stroke="#1e293b" stroke-width="1.5"/>
                        ${pattern}
                    </svg>
                `;
                
                document.getElementById('btn-next-case').classList.remove('hidden');
                document.getElementById('btn-retry').classList.add('hidden');
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                // ハズレ
                playWrongSound();
                card.classList.remove('shake-animation');
                void card.offsetWidth;
                card.classList.add('shake-animation');
                setTimeout(() => { card.classList.add('disabled-card'); }, 500);
                
                title.innerText = "ちがった！💦";
                title.className = "text-4xl font-black mb-2 text-red-500";
                modal.querySelector('.bg-white').className = "bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl text-center pop-in border-8 border-red-400";
                text.innerText = "このサメは犯人じゃないみたいだ。手帳をもう一度よく見てみよう！";
                img.innerHTML = itemInfo.face.svg; // アザラシ泣き顔
                
                document.getElementById('btn-next-case').classList.add('hidden');
                document.getElementById('btn-retry').classList.remove('hidden');
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeResultModal() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('flex');
        }

        // 次の事件へ（リセット）
        function resetGame() {
            closeResultModal();
            document.getElementById('deduce-screen').classList.add('hidden');
            document.getElementById('deduce-screen').classList.remove('flex');
            
            // 探偵ブックを確実に閉じる（バグ修正）
            const book = document.getElementById('detective-book');
            book.classList.add('hidden');
            book.classList.remove('flex');
            
            // 状態リセット
            foundClues.clear();
            ['face', 'bite', 'sardine', 'weed'].forEach(type => {
                document.getElementById(`target-${type}`).classList.remove('target-found');
                const el = document.getElementById(`book-${type}`);
                el.className = "border-2 border-dashed border-gray-400 rounded-xl p-3 flex items-center gap-4 bg-white/50 opacity-60";
                el.innerHTML = `<div class="w-16 h-16 bg-gray-200 rounded flex-shrink-0 flex items-center justify-center text-3xl">❓</div><div class="text-gray-500 font-bold">まだ調べていない</div>`;
            });
            document.getElementById('btn-deduce').classList.add('hidden');
            
            // タイトル画面へ戻る
            document.getElementById('title-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
